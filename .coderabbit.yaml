language: "en-US"
tone_instructions: >-
  Keep findings concise and directly actionable. Avoid long summaries, repeated
  context, and large code examples.
reviews:
  profile: "quiet"
  high_level_summary: false
  review_status: false
  review_info: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  path_instructions:
    - path: "**/*"
      instructions: |
        Review the pull request diff and only the surrounding code needed to
        evaluate it. Do not perform a full repository review. Focus on confirmed,
        actionable correctness, security, and regression issues. Treat
        specification-to-code traceability and consistency with `.specify` as
        core invariants; do not invent requirements that are not supported by
        repository specifications. Preserve existing architecture and public
        interfaces unless a change is necessary to fix a confirmed defect.

        Report only high-confidence, actionable defects. Group duplicate
        findings that share the same root cause. Do not report stylistic
        preferences, low-confidence suspicions, unrelated refactoring,
        dependency changes, or formatting-only issues. When a finding requires
        a significant architectural decision, state the concrete risk briefly
        without prescribing a speculative redesign.

        For each finding, state the affected behavior, concrete impact, and
        smallest practical fix in a few sentences. Do not repeat the PR summary,
        quote large code blocks, or include generic praise. Mention a test gap
        only when it is directly relevant, and never claim a test or check was
        run unless it was actually executed.
